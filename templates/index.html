<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于YOLOv8的目标检测识别项目</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #333333;
            height: 100vh;
            overflow: hidden;
        }

        .main-container {
            display: flex;
            height: 100vh;
        }

        /* 左侧设置面板 */
        .left-panel {
            width: 350px;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-section {
            padding: 15px;
            border-bottom: 1px solid #e8e8e8;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #67C23A;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e8e8e8;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #666666;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 6px 10px;
            background: #ffffff;
            border: 1px solid #d9d9d9;
            border-radius: 3px;
            color: #333333;
            font-size: 13px;
        }

        .form-control:focus {
            outline: none;
            border-color: #67C23A;
        }

        .input-group {
            display: flex;
            gap: 5px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-browse {
            background: #67C23A;
            color: white;
            white-space: nowrap;
        }

        .btn-browse:hover {
            background: #85CE61;
        }

        .btn-primary {
            background: #67C23A;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #85CE61;
        }

        .btn-primary:disabled {
            background: #4a4a4a;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #d13438;
            color: white;
            flex: 1;
        }

        .btn-danger:hover {
            background: #e44d51;
        }

        .btn-danger:disabled {
            background: #4a4a4a;
            cursor: not-allowed;
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .radio-item input[type="radio"] {
            margin: 0;
        }

        .radio-item label {
            font-size: 13px;
            color: #666666;
            cursor: pointer;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .checkbox-item input[type="checkbox"] {
            margin: 0;
        }

        .checkbox-item label {
            font-size: 13px;
            color: #666666;
            cursor: pointer;
        }

        .control-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .task-info {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #e8e8e8;
        }

        .status-text {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stats-text {
            font-size: 12px;
            color: #666666;
            margin-bottom: 10px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background: #e8e8e8;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #67C23A;
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
        }

        /* 右侧结果面板 */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .result-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #e8e8e8;
            padding: 10px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e8e8e8;
        }

        .section-header-title {
            font-size: 14px;
            font-weight: bold;
            color: #67C23A;
        }

        .btn-small {
            padding: 5px 12px;
            font-size: 12px;
            background: #67C23A;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-small:hover {
            background: #85CE61;
        }

        .image-display-container {
            flex: 1;
            background: #fafafa;
            border-radius: 4px;
            border: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .image-display {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-placeholder {
            color: #999999;
            font-size: 14px;
        }

        .image-browser-controls {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            margin-top: 10px;
            border: 1px solid #e8e8e8;
        }

        .image-browser-controls.active {
            display: flex;
        }

        .image-counter {
            font-size: 13px;
            color: #666666;
            min-width: 80px;
            text-align: center;
        }

        .terminal-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            min-height: 200px;
        }

        .terminal-output {
            flex: 1;
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            color: #333333;
            overflow-y: auto;
            line-height: 1.5;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry.error {
            color: #ff4d4f;
        }

        .log-entry.success {
            color: #67C23A;
        }

        .log-entry.warning {
            color: #faad14;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f5f5;
        }

        ::-webkit-scrollbar-thumb {
            background: #d9d9d9;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bfbfbf;
        }

        /* 文件上传区域 */
        .file-input {
            display: none;
        }

        select.form-control {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左侧设置面板 -->
        <div class="left-panel">
            <!-- 模型设置 -->
            <div class="panel-section">
                <div class="section-title">模型设置</div>
                <div class="form-group">
                    <label class="form-label">模型路径:</label>
                    <div class="input-group">
                        <select id="modelSelect" class="form-control">
                            <option value="">选择模型...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">置信度阈值:</label>
                    <input type="number" id="confThresh" class="form-control" value="0.25" min="0.1" max="1.0" step="0.05">
                </div>
                <div class="form-group">
                    <label class="form-label">IoU阈值:</label>
                    <input type="number" id="iouThresh" class="form-control" value="0.45" min="0.1" max="1.0" step="0.05">
                </div>
                <div class="form-group">
                    <label class="form-label">图像尺寸:</label>
                    <input type="number" id="imgSize" class="form-control" value="640" min="32" max="1280" step="32">
                </div>
            </div>

            <!-- 推理模式 -->
            <div class="panel-section">
                <div class="section-title">推理模式</div>
                <div class="form-group">
                    <label class="form-label">推理模式:</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="modeImage" name="mode" value="image" checked>
                            <label for="modeImage">图片模式</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="modeFolder" name="mode" value="folder">
                            <label for="modeFolder">文件夹模式</label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">输入路径:</label>
                    <div class="input-group">
                        <input type="text" id="inputPath" class="form-control" readonly placeholder="选择图片或文件夹">
                        <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
                        <input type="file" id="folderInput" class="file-input" webkitdirectory directory multiple>
                        <button class="btn btn-browse" id="browseBtn">浏览...</button>
                    </div>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="saveResults" checked>
                    <label for="saveResults">保存检测结果</label>
                </div>
                <div class="checkbox-item" style="display:none;">
                    <button class="btn btn-small" id="viewResultsBtn" disabled>查看检测结果</button>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="panel-section">
                <div class="control-buttons">
                    <button class="btn btn-primary" id="startBtn">开始推理</button>
                    <button class="btn btn-danger" id="stopBtn" disabled>停止推理</button>
                </div>
            </div>

            <!-- 任务信息 -->
            <div class="panel-section">
                <div class="section-title">任务信息</div>
                <div class="task-info">
                    <div class="status-text" id="statusText" style="color: #333333;">状态: 就绪</div>
                    <div class="stats-text" id="statsText">等待推理开始...</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar">0%</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧结果面板 -->
        <div class="right-panel">
            <!-- 检测结果预览区 -->
            <div class="result-section">
                <div class="section-header">
                    <div class="section-header-title">检测结果预览</div>
                    <button class="btn-small" id="saveImgBtn">保存图片</button>
                </div>
                <div class="image-display-container" id="imageContainer">
                    <img id="imageDisplay" class="image-display" style="display: none;">
                    <div class="image-placeholder" id="imagePlaceholder">等待检测...</div>
                </div>
                <div class="image-browser-controls" id="browserControls">
                    <button class="btn-small" id="prevImgBtn">« 上一张</button>
                    <span class="image-counter" id="imageCounter">0/0</span>
                    <button class="btn-small" id="nextImgBtn">下一张 »</button>
                    <button class="btn-small" id="closeBrowserBtn">关闭浏览器</button>
                </div>
            </div>

            <!-- 终端输出区 -->
            <div class="terminal-section">
                <div class="section-header">
                    <div class="section-header-title">终端输出</div>
                    <button class="btn-small" id="clearTerminalBtn">清除</button>
                </div>
                <div class="terminal-output" id="terminalOutput"></div>
            </div>
        </div>
    </div>

    <script>
        // WebSocket连接
        const socket = io();

        // DOM元素
        const modelSelect = document.getElementById('modelSelect');
        const confThresh = document.getElementById('confThresh');
        const iouThresh = document.getElementById('iouThresh');
        const imgSize = document.getElementById('imgSize');
        const modeImage = document.getElementById('modeImage');
        const modeFolder = document.getElementById('modeFolder');
        const inputPath = document.getElementById('inputPath');
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const browseBtn = document.getElementById('browseBtn');
        const saveResults = document.getElementById('saveResults');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const statsText = document.getElementById('statsText');
        const progressBar = document.getElementById('progressBar');
        const imageDisplay = document.getElementById('imageDisplay');
        const imagePlaceholder = document.getElementById('imagePlaceholder');
        const browserControls = document.getElementById('browserControls');
        const prevImgBtn = document.getElementById('prevImgBtn');
        const nextImgBtn = document.getElementById('nextImgBtn');
        const imageCounter = document.getElementById('imageCounter');
        const closeBrowserBtn = document.getElementById('closeBrowserBtn');
        const saveImgBtn = document.getElementById('saveImgBtn');
        const terminalOutput = document.getElementById('terminalOutput');
        const clearTerminalBtn = document.getElementById('clearTerminalBtn');

        let uploadedFiles = [];
        let resultImages = [];
        let currentImageIndex = 0;

        // 加载模型列表
        fetch('/api/list_models')
            .then(res => res.json())
            .then(models => {
                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.path;
                    option.textContent = model.name;
                    modelSelect.appendChild(option);
                });
                if (models.length > 0) {
                    modelSelect.value = models[0].path;
                }
            });

        // 模式切换
        modeImage.addEventListener('change', () => {
            if (modeImage.checked) {
                inputPath.placeholder = '选择图片';
            }
        });

        modeFolder.addEventListener('change', () => {
            if (modeFolder.checked) {
                inputPath.placeholder = '选择文件夹';
            }
        });

        // 浏览按钮
        browseBtn.addEventListener('click', () => {
            if (modeImage.checked) {
                fileInput.click();
            } else {
                folderInput.click();
            }
        });

        // 文件选择
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                inputPath.value = files.map(f => f.name).join('; ');
                await uploadFiles(files);
            }
        });

        folderInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            // 只过滤图片文件
            const imageFiles = files.filter(file => {
                const ext = file.name.toLowerCase().split('.').pop();
                return ['jpg', 'jpeg', 'png', 'bmp', 'webp'].includes(ext);
            });

            if (imageFiles.length > 0) {
                inputPath.value = `${imageFiles.length} 个图片文件`;
                await uploadFiles(imageFiles);
            } else {
                alert('文件夹中没有找到图片文件');
            }
        });

        // 上传文件
        async function uploadFiles(files) {
            // 禁用开始按钮，显示上传中
            startBtn.disabled = true;
            addLog(`正在准备 ${files.length} 个文件...`);
            const fileDataList = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                const fileData = await new Promise((resolve) => {
                    reader.onload = (e) => {
                        resolve({
                            name: file.name,
                            data: e.target.result
                        });
                    };
                    reader.readAsDataURL(file);
                });
                fileDataList.push(fileData);

                // 显示读取进度
                if ((i + 1) % 5 === 0 || i === files.length - 1) {
                    addLog(`已读取 ${i + 1}/${files.length} 个文件`);
                }
            }

            // 分批上传文件（每批10个，避免消息过大）
            const batchSize = 10;
            uploadedFiles = [];

            for (let i = 0; i < fileDataList.length; i += batchSize) {
                const batch = fileDataList.slice(i, i + batchSize);
                addLog(`正在上传第 ${Math.floor(i / batchSize) + 1}/${Math.ceil(fileDataList.length / batchSize)} 批文件...`);

                // 等待这一批上传完成
                await new Promise((resolve) => {
                    socket.emit('upload_files', { files: batch });
                    socket.once('upload_complete', (data) => {
                        uploadedFiles = uploadedFiles.concat(data.files);
                        resolve();
                    });
                });
            }

            // 所有文件上传完成
            startBtn.disabled = false;
            addLog(`✓ 文件上传完成，共 ${uploadedFiles.length} 个文件，可以开始推理`, 'success');
        }

        // 开始推理
        startBtn.addEventListener('click', () => {
            if (!modelSelect.value) {
                alert('请选择模型文件');
                return;
            }

            if (uploadedFiles.length === 0) {
                alert('请先选择图片或文件夹');
                return;
            }

            startBtn.disabled = true;
            stopBtn.disabled = false;
            resultImages = [];
            currentImageIndex = 0;
            browserControls.classList.remove('active');

            const mode = modeImage.checked ? 'image' : 'folder';

            socket.emit('start_inference', {
                mode: mode,
                model_path: modelSelect.value,
                conf_thresh: parseFloat(confThresh.value),
                iou_thresh: parseFloat(iouThresh.value),
                img_size: parseInt(imgSize.value),
                save_results: saveResults.checked,
                files: uploadedFiles
            });
        });

        // 停止推理
        stopBtn.addEventListener('click', () => {
            socket.emit('stop_inference');
        });

        // WebSocket事件
        socket.on('status', (data) => {
            statusText.textContent = `状态: ${data.status}`;
            statusText.style.color = data.color;
        });

        socket.on('log', (data) => {
            addLog(data.message);
        });

        socket.on('progress', (data) => {
            progressBar.style.width = `${data.progress}%`;
            progressBar.textContent = `${data.progress}%`;
        });

        socket.on('image_result', (data) => {
            resultImages.push(data.path);
            showImage(data.path);
            statsText.textContent = `已处理: ${data.index + 1}/${data.total}`;
        });

        socket.on('inference_complete', (data) => {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            addLog(`推理完成！共生成 ${data.results.length} 个结果`, 'success');

            if (data.results.length > 0) {
                resultImages = data.results.map(r => r.path);
                currentImageIndex = 0;
                showImage(resultImages[0]);
                updateBrowserControls();
                browserControls.classList.add('active');
            }
        });

        socket.on('error', (data) => {
            addLog(`错误: ${data.message}`, 'error');
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        // 显示图片
        function showImage(path) {
            imageDisplay.src = path + '?t=' + new Date().getTime();
            imageDisplay.style.display = 'block';
            imagePlaceholder.style.display = 'none';
        }

        // 更新浏览器控件
        function updateBrowserControls() {
            imageCounter.textContent = `${currentImageIndex + 1}/${resultImages.length}`;
        }

        // 上一张
        prevImgBtn.addEventListener('click', () => {
            if (resultImages.length === 0) return;
            currentImageIndex = (currentImageIndex - 1 + resultImages.length) % resultImages.length;
            showImage(resultImages[currentImageIndex]);
            updateBrowserControls();
        });

        // 下一张
        nextImgBtn.addEventListener('click', () => {
            if (resultImages.length === 0) return;
            currentImageIndex = (currentImageIndex + 1) % resultImages.length;
            showImage(resultImages[currentImageIndex]);
            updateBrowserControls();
        });

        // 关闭浏览器
        closeBrowserBtn.addEventListener('click', () => {
            browserControls.classList.remove('active');
            imageDisplay.style.display = 'none';
            imagePlaceholder.style.display = 'block';
            imagePlaceholder.textContent = '等待检测...';
        });

        // 保存图片
        saveImgBtn.addEventListener('click', () => {
            if (imageDisplay.src) {
                const link = document.createElement('a');
                link.href = imageDisplay.src;
                link.download = `detection_result_${Date.now()}.jpg`;
                link.click();
            }
        });

        // 清除终端
        clearTerminalBtn.addEventListener('click', () => {
            terminalOutput.innerHTML = '';
        });

        // 添加日志
        function addLog(message, type = 'normal') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            terminalOutput.appendChild(entry);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // 初始化日志
        addLog('YOLOv8 Web 检测系统已就绪');
    </script>
</body>
</html>
